<!doctype html>
<html lang="en" data-fs-theme="freesense" data-fs-mode="auto" data-bs-theme="light" data-fs-accent="coral" data-fs-density="comfortable"
	data-fs-skin-topbar="surface" data-fs-skin-section="surface" data-fs-skin-cards="outlined" data-fs-skin-tables="lines" data-fs-skin-buttons="rounded">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fs-themes" content="/themes">
<meta name="fs-csrf" content="gallery">
<title>{{title}} · FreeSense</title>
<script>
	/* Server-side in the product (user preference). The gallery resolves 'auto' before first paint to avoid a flash. */
	(function (r) { if (r.dataset.fsMode === 'auto') r.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; })(document.documentElement);
</script>
<link rel="stylesheet" href="/ui/fs-ui.css">
<link rel="stylesheet" id="fs-theme-freesense" href="/themes/freesense/theme.css">
</head>
<body class="fs-app" data-fs-el="app-shell" data-fs-layout="{{layout}}" data-fs-config='{"area":"{{area}}"}'>
<a class="fs-skip" href="#fs-main">Skip to content</a>
<div class="fs-progress" aria-hidden="true"></div>

<header class="fs-topbar">
	<div class="fs-topbar-inner">
		<button type="button" class="fs-tb-btn fs-topbar-menu" data-fs-shell="drawer" aria-controls="fs-navdrawer" aria-expanded="false" aria-label="Open menu"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
		<a class="fs-brand" href="/gallery/app/" data-fs-nav><span class="fs-brand-mark" aria-hidden="true">FS</span><span class="fs-brand-name">FreeSense</span></a>
		<nav class="fs-areas" aria-label="Main">{{areas}}</nav>
		<div class="fs-topbar-tools">
			<div data-fs-el="command-palette" data-fs-config='{"trigger":"search","signOut":{}}'></div>
			<div data-fs-el="notifications" data-fs-config='{"source":{"path":"/v1/notices"},"every":30}'></div>
			<div data-fs-el="profile-menu" data-fs-config='{"modeToggle":true,"links":{"profile":"/gallery/app/me","appearance":"/gallery/app/me#appearance","sessions":"/gallery/app/me#sessions"}}'></div>
		</div>
	</div>
</header>

<div class="fs-navdrawer" id="fs-navdrawer" aria-label="Menu" hidden>{{drawer}}</div>
<div class="fs-scrim" aria-hidden="true"></div>

<div class="fs-body">
	<aside class="fs-pagemenu" aria-label="{{menuTitle}}"{{menuHidden}}>{{menu}}</aside>
	<main class="fs-main" id="fs-main" data-fs-main data-fs-page="{{page}}" data-fs-area="{{area}}" data-fs-layout="{{layout}}" tabindex="-1">
{{main}}
	</main>
</div>

<script type="application/json" id="fs-nav">{{nav}}</script>
<script src="/ui/fs-ui.js"></script>
<!--fs-mock-->
</body>
</html>
