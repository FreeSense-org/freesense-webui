name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, checks and dist up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (no dependency install scripts)
        run: npm ci --ignore-scripts
      - name: Provenance (FreeSense headers, no upstream references)
        run: node tools/check/provenance.mjs
      - name: Unit tests
        run: npm test
      - name: Theme checks (scheme, schema, contrast)
        run: npm run check:themes
      - name: Build
        run: npm run build
      - name: dist/ matches the sources
        run: |
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "::error::dist/ has untracked build output. Run 'npm run build' and commit the result."
            exit 1
          fi
      - name: Released theme schemes are frozen
        run: node tools/theme/frozen.mjs

  app:
    name: PHP app (lint and tests)
    runs-on: ubuntu-latest
    container: php:8.5-cli
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests (against the committed dist/)
        run: php -d error_reporting=E_ALL tests/app/AppTest.php

  inventory:
    name: 1.x inventory matches the baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: FreeSense-org/freesense
          ref: webui-1.x-baseline
          path: .baseline/freesense
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node tools/inventory/build-inventory.mjs .baseline/freesense --check
